[project]
name = "invoiceiq"
version = "0.1.0"
description = "AI invoice extraction pipeline with LangChain, Groq, and FastAPI"
readme = "README.md"
authors = [
    { name = "Aryan Kumar", email = "aryankumarbndm0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.3.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "pytesseract>=0.3.13",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
invoiceiq = "invoiceiq:main"
invoiceiq-eval = "invoiceiq.evaluation.run_eval:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: requires a live Groq API call (set INVOICEIQ_LIVE_TESTS=1)",
    "dataset: uses the downloaded assignment pack (set INVOICEIQ_DATASET_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
